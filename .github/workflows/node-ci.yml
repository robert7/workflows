name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node_versions:
        description: JSON array of Node.js versions to test
        required: false
        type: string
        default: '["22.13.0", "24"]'
      coverage_node_version:
        description: Node.js version whose coverage report is uploaded
        required: false
        type: string
        default: '24'
    secrets:
      codecov_token:
        required: false

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node_versions) }}
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.codecov_token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code quality checks
        run: ./code-quality.sh

      - name: Upload coverage to Codecov
        if: ${{ success() && env.CODECOV_TOKEN != '' && matrix.node-version == inputs.coverage_node_version }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
